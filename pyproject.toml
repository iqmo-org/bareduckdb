[project]
name = "bareduckdb"
dynamic = ["version"]
description = "Minimal Cython-based DuckDB Bindings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typing-extensions>=4.15.0",
]
authors = [{name = "Paul T", email = "paul@iqmo.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Programming Language :: Python :: Free Threading",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/iqmo-org/bareduckdb"
Repository = "https://github.com/iqmo-org/bareduckdb"
Issues = "https://github.com/iqmo-org/bareduckdb/issues"

[project.optional-dependencies]
arrow = [
    "pyarrow>=23.0.0; python_version >= '3.10' and python_version < '3.15' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "pyarrow>=23.0.0.dev0; python_version >= '3.15' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-randomly>=4.0.1",
    "pytest-run-parallel>=0.2.0",
    "pytest-forked>=1.6.0",
    "pytest-repeat>=0.9.3",
    "psutil>=5.9.0",
    "pyarrow>=22.0",
    "pandas>=3.0.0rc0",
]

[tool.pyright]
typeCheckingMode = "basic"
reportGeneralTypeIssues = false
reportPrivateImportUsage = false
reportAttributeAccessIssue = false
reportMissingTypeStubs = false
exclude = ["benchmark/**", "setup.py"]
venvPath = "."
venv = ".venv"
ignore = ["tests/**"]

[build-system]
requires = [
    "setuptools>=42",
    "setuptools-scm>=8",
    "wheel",
    "Cython>=3.0",
    "pyarrow>=22.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bareduckdb", "bareduckdb.core", "bareduckdb.core.impl", "bareduckdb.aio", "bareduckdb.compat", "bareduckdb._libs", "bareduckdb.functional", "bareduckdb.dataset", "bareduckdb.data_sources", "bareduckdb.common", "bareduckdb.common.impl"]

[tool.setuptools.package-data]
# libduckdb.{so,dylib} on Linux/macOS; duckdb.dll on Windows
bareduckdb = ["_libs/libduckdb.*", "_libs/duckdb.dll"]

[tool.setuptools_scm]
version_file = "src/bareduckdb/_version.py"

[tool.cibuildwheel]
build-frontend = "build[uv]"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
enable = ["cpython-prerelease"]  # TODO: remove when 3.15 ships
test-requires = ["uv"]

[tool.cibuildwheel.linux]
# Don't bundle PyArrow libraries - loaded dynamically.
# Wildcards, so this keeps working as the pyarrow soname version moves.
repair-wheel-command = "auditwheel repair --exclude 'libarrow.so.*' --exclude 'libarrow_python.so.*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --ignore-missing-dependencies -w {dest_dir} -v {wheel}"

[[tool.cibuildwheel.overrides]]
# TODO: remove when 3.15 ships
select = ["cp315-*", "cp315t-*"]
# build-frontend is build[uv], so the test env installs via `uv pip`; UV_EXTRA_INDEX_URL
test-environment = { UV_EXTRA_INDEX_URL = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple", PIP_EXTRA_INDEX_URL = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" }

[tool.cython-lint]
max-line-length = 160

[tool.ruff]
line-length = 160
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "docs/source/conf.py",
  "tests",
  "benchmark",
  "tests.ipynb",
  "analysis",
  "working",
  "benchmarks",
  "dev_*.py",
  "test_*.py",
  "*_repro.py",
  "setup.py",
  "notebooks",
  "external"
]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort
select = ["F", "E", "W", "S", "B", "G", "N", "I001", "T", "PD", "C90"]
ignore = [
  # E203,
  # "W503",
  # "W293",
  "W291",
  "E501",
  "S608",
  "C901"
]

[tool.uv]
default-groups = ["dev"]
environments = [ # no need to resolve packages beyond these platforms with uv...
    "python_version >= '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "python_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_version >= '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]
#required-environments = [ 
#    "python_version >= '3.13' and sys_platform == 'darwin' and platform_machine == 'arm64'",
#    "python_version >= '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
#]
exclude-newer = "2 weeks"
exclude-newer-package = { cython = false, pyarrow = false, pandas = false, ipython = false, numpy = false, ipykernel = false }  # TODO: Remove after 3.15 release

prerelease = "if-necessary"

[[tool.uv.index]]
name = "scientific-python-nightly"
url = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple"
explicit = true

[tool.uv.sources]
# 3.15 has no stable pyarrow / pandas wheels; pull from the nightlies on 3.15+.
# TODO: remove when 3.15 ships
pyarrow = [{ index = "scientific-python-nightly", marker = "python_version >= '3.15'" }]
pandas  = [{ index = "scientific-python-nightly", marker = "python_version >= '3.15'" }]

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "ipykernel>=7.0.1;python_version < '3.14'",
    #"magic-duckdb",  # Install with: uv pip install magic-duckdb --no-deps
    "pandas>=3.0.0rc0",
    "pandas-stubs",
    "polars>=1.34.0;python_version < '3.14'",
    "pre-commit-uv>=4.2.0",
    "pyarrow>=22.0",
    "pyarrow-stubs", # out of date, but good enough
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-forked>=1.6.0",
    "pytest-randomly>=4.0.1",
    "pytest-run-parallel>=0.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "pytest-repeat>=0.9.3",
    "vortex-data;python_version < '3.14' and sys_platform != 'win32'", # no free-threaded, no windows wheels
    "tabulate",
    "ruff>=0.14.10",
]
downstream = [
    "duckdb-engine>=0.17.0",
    # "ibis-framework[duckdb]>=11.0.0",  # disabled until supports pandas 3.0
    "ipython>=9.7.0",
    "jupysql>=0.11.1",
    "magic-duckdb>=0.2.3",
    "sqlalchemy>=2.0.44",
]

[tool.uv.extra-build-dependencies]
bareduckdb = ["Cython"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 90
# Ignore downstream tests by default (they require special installation)
addopts = [
    "-v",
    "--durations=5",
    "-n", "auto",
    "--maxprocesses=8",  # Cap workers to avoid MemoryError on large data tests
    "--maxfail=10",
    "--cov=bareduckdb",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--ignore=tests/downstream",
    "--ignore=tests/experimental",
    "--ignore=tests/comparison",
    "--ignore=tests/benchmarks",
]
# For free-threaded Python: Convert GIL re-enablement warnings to errors
# This prevents INTERNALERROR in xdist and gives clear error messages
filterwarnings = [
    "error::RuntimeWarning",
    "ignore:invalid escape sequence:SyntaxWarning:sql.parse", # jupysql
]

[tool.coverage.run]
source = ["src/bareduckdb"]
branch = true
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/tests/downstream/*",
    "*.pyx",  # Cython source files
    "*/impl/*.pyx",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
skip_covered = false
skip_empty = true
precision = 2
