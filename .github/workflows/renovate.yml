# Self-hosted Renovate
#
# 1. Create a fine-grained PAT owned by iqmo-org:
# 2. Store it as a repo secret (prompts for the value):
#    gh secret set RENOVATE_TOKEN --repo <REPO>
# 3. Run once and check the log lists pep621, github-actions and pre-commit:
#
#    gh workflow run renovate.yml --repo <REPO>
#    gh run watch --repo <REPO>
#
# 4. Once Renovate PRs open and CI runs on them, turn off Dependabot security
#    updates so the two tools do not open duplicate PRs (alerts stay on):
#
#    gh api -X DELETE repos/<REPO>/automated-security-fixes
#
# The PAT expires after 90 days. To rotate, regenerate it in
# Settings > Developer settings > Fine-grained tokens and repeat step 2.

name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GIT_AUTHOR: "paultiq <104510378+paultiq@users.noreply.github.com>"
