name: Sanitizer Testing (TSAN/ASAN/UBSAN)

# A full TSAN+ASAN pass rebuilds a sanitizer-instrumented CPython image's extension and runs
# (close to) the whole suite once sequentially (ASAN) and once under --parallel-threads (TSAN);
# that is 30-60+ minutes per arm, so it must not run on every push. Hence two narrow triggers,
# and no `workflow_dispatch`-only configuration, which would mean it never runs at all:
#   - push to main, but only when the C boundary changed (capi/ Cython+C, or this workflow
#     file itself) - this is where a signature drift against duckdb_v2.h or a lock-discipline
#     regression actually lives, and it is also the lowest-frequency directory in the repo, so
#     the cost is bounded.
#   - a nightly schedule, as the safety net for anything the path filter misses (a Python-level
#     change in core/ or compat/ that shifts call timing enough to expose a race that was
#     already latent in unchanged capi/ code).
# workflow_dispatch stays for manual runs (e.g. testing a suspected race by hand).
on:
  push:
    branches: [main]
    paths:
      - 'src/bareduckdb/capi/**'
      - '.github/workflows/sanitizers.yml'
  schedule:
    - cron: '17 7 * * *' # nightly, off the hour to avoid the GH Actions top-of-hour pile-up
  workflow_dispatch:

jobs:
  sanitizers:
    name: 'Sanitizer Tests - ${{ matrix.sanitizer }}'
    runs-on: ubuntu-latest
    #self-hosted

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: 'TSAN'
            docker-image: 'ghcr.io/nascheme/cpython-tsan:3.14t'
            sanitizer-env: 'TSAN_OPTIONS=halt_on_error=1'
          - sanitizer: 'ASAN'
            docker-image: 'ghcr.io/nascheme/cpython-asan:3.14t'
            sanitizer-env: 'ASAN_OPTIONS=allocator_may_return_null=1:halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_invalid_pointer_pairs=2:symbolize=1:fast_unwind_on_malloc=0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Run ${{ matrix.sanitizer }} tests in Docker
        shell: bash
        run: |
          echo "Pre-Docker Debugging"
          echo "github.workspace: ${{ github.workspace }}"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Contents of PWD:"
          ls -la "$(pwd)" | head -30
          echo "Contents of github.workspace:"
          ls -la "${{ github.workspace }}" | head -30
          echo "Checking for critical files in PWD:"
          ls -l "$(pwd)/CMakeLists.txt" "$(pwd)/pyproject.toml" 2>&1 || echo "Files missing in PWD!"
          echo "Checking for critical files in github.workspace:"
          ls -l "${{ github.workspace }}/CMakeLists.txt" "${{ github.workspace }}/pyproject.toml" 2>&1 || echo "Files missing in github.workspace!"

          # Use PWD instead of github.workspace for self-hosted runners
          WORKSPACE_PATH="$(pwd)"
          echo "Using WORKSPACE_PATH: $WORKSPACE_PATH"

          # Pull latest version of the TSAN image
          echo "Pulling latest ${{ matrix.docker-image }}"
          docker pull ${{ matrix.docker-image }}

          # Create container and copy files instead of using volume mount
          # Volume mounts can be problematic with self-hosted runners
          CONTAINER_ID=$(docker create \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -w /workspace \
            ${{ matrix.docker-image }} \
            sleep infinity)

          echo "Created container: $CONTAINER_ID"

          # Start the container
          docker start "$CONTAINER_ID"

          # Copy all files from workspace into container
          echo "Copying files from $WORKSPACE_PATH to container:/workspace"
          docker cp "$WORKSPACE_PATH/." "$CONTAINER_ID:/workspace/"

          # Verify files were copied
          echo "Verifying files in container:"
          docker exec "$CONTAINER_ID" ls -la /workspace/ | head -30

          # Run the actual commands
          docker exec "$CONTAINER_ID" bash -c "
              set -e

              echo 'Environment Setup'
              echo 'Current directory:'
              pwd
              echo 'Contents of /workspace:'
              ls -la /workspace/ | head -30
              echo 'Verifying critical files:'
              ls -l /workspace/CMakeLists.txt /workspace/pyproject.toml 2>&1 || echo 'Some files missing!'

              echo 'Installing system dependencies'
              apt-get update -qq
              apt-get install -y -qq unzip curl gcc g++ make clang gdb cmake ninja-build

              # Enable core dumps for debugging crashes
              ulimit -c unlimited
              echo '/tmp/core.%e.%p' > /proc/sys/kernel/core_pattern 2>/dev/null || echo 'Note: Could not set core_pattern (read-only in container), continuing anyway'

              # Combine all TSAN suppression files (CPython, NumPy, etc.)
              if [ '${{ matrix.sanitizer }}' = 'TSAN' ]; then
                if [ -d /work/tsan_suppressions ]; then
                  echo 'Combining TSAN suppression files...'
                  cat /work/tsan_suppressions/*.txt > /tmp/combined_suppressions.txt
                  export TSAN_OPTIONS=\"halt_on_error=1:suppressions=/tmp/combined_suppressions.txt\"
                  echo \"Loaded suppressions from:\"
                  ls -la /work/tsan_suppressions/
                else
                  echo 'Warning: No suppression files found, using default TSAN options'
                  export TSAN_OPTIONS=\"halt_on_error=1\"
                fi
              else
                export ${{ matrix.sanitizer-env }}
              fi

              # Use debug mode for better sanitizer compatibility
              # - Disables LTO which can interfere with sanitizers
              # - Uses -O0 instead of -O3 for more reliable detection
              # - Enables bounds checking and other safety features
              export BAREDUCKDB_OPTIMIZATION=debug

              # Add sanitizer flags to compilation
              if [ '${{ matrix.sanitizer }}' = 'TSAN' ]; then
                export CFLAGS=\"-fsanitize=thread -fno-omit-frame-pointer -g \$CFLAGS\"
                export CXXFLAGS=\"-fsanitize=thread -fno-omit-frame-pointer -g \$CXXFLAGS\"
                export LDFLAGS=\"-fsanitize=thread \$LDFLAGS\"
              else
                export CFLAGS=\"-fsanitize=address -fno-omit-frame-pointer -g \$CFLAGS\"
                export CXXFLAGS=\"-fsanitize=address -fno-omit-frame-pointer -g \$CXXFLAGS\"
                # Use default ASAN runtime (same as Python) instead of -shared-libasan
                export LDFLAGS=\"-fsanitize=address \$LDFLAGS\"
              fi

              echo 'Python version:'
              python --version
              PYTHON_PATH=\$(which python)
              echo \"Using Python at: \$PYTHON_PATH\"

              echo 'Installing UV'
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH=\"\$HOME/.local/bin:\$PATH\"

              echo 'Installing build dependencies (including pyarrow for the test run)'
              uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages --upgrade pip
              uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages \"scikit-build-core>=1.0\" \"cython-cmake>=0.3\" \"Cython>=3.1\" \"setuptools-scm>=8\" pyarrow

              echo 'Installing bareduckdb'
              echo 'Current directory:'
              pwd
              echo 'Files in current directory:'
              ls -la .
              echo 'Checking for CMakeLists.txt in current directory:'
              if [ -f CMakeLists.txt ]; then
                echo 'CMakeLists.txt EXISTS'
                ls -l CMakeLists.txt
              else
                echo 'ERROR: CMakeLists.txt NOT FOUND'
                echo 'Searching for CMakeLists.txt:'
                find / -name CMakeLists.txt 2>/dev/null | head -5
              fi

              # Temporarily disable sanitizer checks during build and dependency installation
              # PyArrow creates singleton objects during import that ASAN reports as leaks
              if [ '${{ matrix.sanitizer }}' = 'ASAN' ]; then
                echo 'Disabling leak detection during installation (PyArrow singletons)'
                export ASAN_OPTIONS='allocator_may_return_null=1:halt_on_error=1:detect_leaks=0'
              elif [ '${{ matrix.sanitizer }}' = 'TSAN' ]; then
                echo 'Disabling race detection during build'
                export TSAN_OPTIONS='halt_on_error=0:detect_deadlocks=0'
              fi

              uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages -e . --no-build-isolation -v

              echo 'Installing test dependencies'
              uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages pytest pytest-asyncio pytest-cov pytest-forked \
                pytest-randomly pytest-run-parallel pytest-timeout pytest-xdist

              echo 'Installing nightly pandas and latest pyarrow'
              uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages --pre --upgrade --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --no-build pandas>=3.0 pyarrow
              # uv pip install --python \"\$PYTHON_PATH\" --system --break-system-packages pyarrow

              # Re-enable sanitizer checks before running tests
              if [ '${{ matrix.sanitizer }}' = 'ASAN' ]; then
                echo 'Re-enabling leak detection for test execution'

                # Create LSAN suppression file for known library false positives
                # Note: leak: suppressions are for LeakSanitizer (LSAN), not ASAN
                # Using printf instead of heredoc to avoid YAML indentation issues
                printf '%s\\n' \\
                  'leak:arrow::duration' \\
                  'leak:arrow::time32' \\
                  'leak:arrow::time64' \\
                  'leak:arrow::date32' \\
                  'leak:arrow::date64' \\
                  'leak:arrow::timestamp' \\
                  'leak:arrow::month_day_nano_interval' \\
                  'leak:arrow::compute::ScalarFunction' \\
                  'leak:arrow::compute::KernelSignature' \\
                  'leak:arrow::compute::literal' \\
                  'leak:arrow::compute::Initialize' \\
                  'leak:arrow::compute::internal::RegisterScalar' \\
                  'leak:libarrow_compute' \\
                  'leak:logging_memory_pool' \\
                  'leak:NpyString_new_allocator' \\
                  'leak:PyUFunc_FromFuncAndDataAndSignatureAndIdentity' \\
                  'leak:PyArrayIdentityHash_New' \\
                  'leak:_datetime_dtype_metadata_clone' \\
                  'leak:npy_alloc_cache_dim' \\
                  'leak:PyDataMem_UserNEW' \\
                  'leak:PyThread_allocate_lock' \\
                  'leak:create_stdio' \\
                  'leak:init_sys_streams' > /tmp/lsan_suppressions.txt

                # ASAN_OPTIONS without suppressions (leak suppressions go in LSAN_OPTIONS)
                export ASAN_OPTIONS='allocator_may_return_null=1:halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_invalid_pointer_pairs=2:symbolize=1:fast_unwind_on_malloc=0'
                export LSAN_OPTIONS='suppressions=/tmp/lsan_suppressions.txt'
                echo "ASAN_OPTIONS: \$ASAN_OPTIONS"
                echo "LSAN_OPTIONS: \$LSAN_OPTIONS"
              elif [ '${{ matrix.sanitizer }}' = 'TSAN' ]; then
                echo 'Re-enabling deadlock detection for test execution'
                # Combine CPython suppressions with bareduckdb suppressions
                if [ -f /workspace/.sanitizer-thread-suppressions.txt ]; then
                  if [ -f /tmp/combined_suppressions.txt ]; then
                    cat /workspace/.sanitizer-thread-suppressions.txt >> /tmp/combined_suppressions.txt
                  else
                    cp /workspace/.sanitizer-thread-suppressions.txt /tmp/combined_suppressions.txt
                  fi
                  export TSAN_OPTIONS='halt_on_error=1:detect_deadlocks=1:suppressions=/tmp/combined_suppressions.txt'
                  echo "Loaded bareduckdb TSAN suppressions"
                else
                  export TSAN_OPTIONS='halt_on_error=1:detect_deadlocks=1'
                  echo "Warning: No bareduckdb suppressions file found"
                fi
              fi

              echo 'Running ${{ matrix.sanitizer }} tests'

              # Function to print stack trace from core dump
              print_crash_info() {
                echo 'CRASH DETECTED'
                local exit_code=\$1
                echo \"Exit code: \$exit_code\"

                # Find core dump
                local core_file=\$(ls -t /tmp/core.* 2>/dev/null | head -1)
                if [ -n \"\$core_file\" ]; then
                  echo \"Core dump found: \$core_file\"
                  echo 'Stack trace from GDB'
                  gdb -batch -ex 'thread apply all bt' -ex 'quit' python \$core_file 2>&1 || echo 'Failed to get stack trace'
                else
                  echo 'No core dump found'
                fi
              }

              # -o addopts= wipes pyproject.toml's [tool.pytest.ini_options] addopts
              # (-n auto, --maxprocesses=8, --maxfail=10, --cov=..., timeout=90 stays because
              # it is a separate ini key, so --timeout below is what actually raises it).
              # Rationale: 90s per test at -O0 under a sanitizer, against fixtures built for
              # a normal build (some >=100M rows), times out before a real defect surfaces;
              # 20 minutes is still bounded but gives a slow ASAN/TSAN run room to finish.
              # This raises the timeout only. The other half of the fix is a tests/ change:
              # shrink the oversized fixtures so they are tractable under a sanitizer at -O0.
              if [ '${{ matrix.sanitizer }}' = 'TSAN' ]; then
                # TSAN: Run parallel tests to expose race conditions.
                # tests/aio is deliberately NOT deselected here. A 'not asyncio' filter would
                # drop all of it (pytest-asyncio's auto mode marks every async test 'asyncio'),
                # and that is the only place the aio connection pool sees concurrent exercise
                # at all - the code that produced a 'free(): chunks in smallbin corrupted'
                # crash. The risk of including it: if pytest-run-parallel and pytest-asyncio
                # conflict, e.g. an event loop driven from more than one --parallel-threads
                # copy, this workflow is where that surfaces.
                set +e
                THREADS=\$(($(nproc) < 4 ? $(nproc) : 4))
                python -m pytest tests/ \
                  -o addopts= \
                  --parallel-threads=\$THREADS \
                  -n 0 \
                  --iterations=5 \
                  --tb=short \
                  --timeout=1200 \
                  --maxfail=5 \
                  -v \
                  --ignore=tests/experimental \
                  --ignore=tests/downstream \
                  --ignore=tests/comparison \
                  --ignore=tests/benchmarks \
                  2>&1 | tee /workspace/${{ matrix.sanitizer }}_output.txt
                exit_code=\$?
                if [ \$exit_code -eq 139 ] || [ \$exit_code -eq 134 ]; then
                  print_crash_info \$exit_code
                fi
                exit \$exit_code
              else
                # ASAN: Run tests sequentially without --forked
                # NOTE: --forked uses os.fork() which is incompatible with ASAN
                # in multi-threaded Python 3.14t (causes CHECK failed in __cxa_throw)
                # -x (stop on first failure) is kept: ASAN is exploratory here (first real
                # finding is the signal), and with --timeout raised to 1200s it no longer
                # times out before it can reach one.
                set +e
                python -m pytest tests/ \
                  -o addopts= \
                  -x \
                  -n 0 \
                  --tb=short \
                  --timeout=1200 \
                  -v \
                  --ignore=tests/experimental \
                  --ignore=tests/downstream \
                  --ignore=tests/comparison \
                  --ignore=tests/benchmarks \
                  2>&1 | tee /workspace/${{ matrix.sanitizer }}_output.txt
                exit_code=\$?
                if [ \$exit_code -eq 139 ] || [ \$exit_code -eq 134 ]; then
                  print_crash_info \$exit_code
                fi
                exit \$exit_code
              fi
            "

          # Cleanup: stop and remove container
          echo "Cleaning up container: $CONTAINER_ID"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"

      - name: Upload ${{ matrix.sanitizer }} results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.sanitizer }}-results
          path: |
            ${{ matrix.sanitizer }}_output.txt
          retention-days: 7

  ubsan:
    name: 'Sanitizer Tests - UBSAN'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # UBSAN does not need a specially instrumented CPython the way TSAN/ASAN do (it does not
      # replace the allocator and does not need libpthread-level instrumentation): it just
      # needs -fsanitize=undefined on the code being checked. So this runs on a stock
      # setup-python interpreter instead of the nascheme docker images, with the flags applied
      # only to bareduckdb's own compiled Cython/C - the boundary duckdb_v2.pxd describes.
      #
      # What this catches that ASAN/TSAN do not: the gap left by
      # test_pxd_declarations_match_header, which compares only declared names and top-level
      # parameter count, never argument types, pointer depth, const-ness, or return type. A
      # duckdb_v2_str_t swapped for a const char*, a dropped level of indirection, or an idx_t*
      # that became an idx_t all pass that gate. Some of those show up as misaligned loads,
      # invalid pointer arithmetic, or signed-overflow in the *generated* C - exactly what
      # -fsanitize=undefined instruments. It does NOT need libduckdb.so itself to be
      # instrumented (it is an uninstrumented prebuilt either way; see the ASAN caveat above),
      # because the hazard here is a wrong call shape on our side of the boundary, not a bug
      # inside DuckDB.
      #
      # What it will NOT catch: anything requiring the allocator interception ASAN provides
      # (use-after-free/double-free such as the smallbin corruption - see the ASAN job's own
      # limits above) or anything requiring TSAN's happens-before tracking. UBSAN is
      # a narrow, cheap, complementary arm, not a replacement for either.
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: -ubsan

      - name: Build with UBSAN instrumentation
        shell: bash
        env:
          BAREDUCKDB_OPTIMIZATION: debug
        run: |
          set -euo pipefail
          export CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g ${CFLAGS:-}"
          export CXXFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g ${CXXFLAGS:-}"
          export LDFLAGS="-fsanitize=undefined ${LDFLAGS:-}"
          uv sync --no-install-project
          uv sync --reinstall-package bareduckdb -v

      - name: Run UBSAN tests
        shell: bash
        env:
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          set +e
          # Scoped to the C boundary rather than the full suite: this arm exists to catch a
          # wrong duckdb_v2.pxd signature or an alignment bug in our own generated C, which is
          # exercised by tests/capi and tests/core, not by, say, tests/downstream or
          # tests/comparison (third-party client code we do not compile). Full-suite UBSAN
          # would roughly double this job's cost for coverage that is already provided by the
          # TSAN/ASAN full-suite runs in the sibling job.
          uv run --no-sync pytest tests/capi tests/core \
            -o addopts= \
            -x \
            -n 0 \
            --tb=short \
            --timeout=1200 \
            -v \
            2>&1 | tee UBSAN_output.txt
          exit_code=$?
          exit $exit_code

      - name: Upload UBSAN results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: UBSAN-results
          path: |
            UBSAN_output.txt
          retention-days: 7
