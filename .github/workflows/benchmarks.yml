name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: 'Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: -benchmarks
      - name: Check resources
        run: |
          cat /proc/meminfo | head -5
          ulimit -a
          nproc
      # gcc-14/g++-14 are preinstalled on the ubuntu-latest image, so this only
      # selects them via CC/CXX. No apt-get update, no update-alternatives.
      - name: Setup Compiler
        shell: bash
        run: |
          gcc-14 --version
          g++-14 --version
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Refresh lock for nightly deps
        run: uv lock --upgrade

      - name: Build current repo
        run: uv sync

      - name: Run benchmarks
        id: bench
        shell: bash
        run: |
          set -u
          status=0
          ./run_benchmarks.sh || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results/

      # --no-gate because run_benchmarks.sh already gated
      - name: Generate comparison
        id: comparison
        if: always()
        shell: bash
        run: |
          set -u
          status=0
          uv run python tests/benchmarks/compare_results.py benchmark-results --no-gate > comparison.md || status=$?
          cat comparison.md
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Fork PRs get a read-only token, so gh pr comment would fail for any
      # external contributor. Only comment on same-repo PRs.
      - name: Comment on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file comparison.md

      - name: Fail on benchmark regression
        if: >-
          always() &&
          (steps.bench.outputs.status != '0' ||
           steps.comparison.outputs.status != '0')
        run: |
          echo "run_benchmarks.sh exited ${{ steps.bench.outputs.status }}, compare_results.py exited ${{ steps.comparison.outputs.status }}."
          echo "See the comparison above for the case that breached the regression gate."
          exit 1
