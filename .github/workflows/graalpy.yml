name: GraalPy

# workflow_call so build_wheels.yml and dev_versions.yml can chain it
on:
  workflow_call:
  workflow_dispatch:

# Build, repair and test settings live in pyproject.toml's `gp*` cibuildwheel override.
# Linux x86_64 only: Oracle's GraalPy index has no pyarrow wheel for any other platform.
jobs:
  graalpy:
    name: 'GraalPy - gp313_253 - manylinux x86_64'
    runs-on: ubuntu-latest

    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Build and test GraalPy wheel
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          only: gp313_253-manylinux_x86_64

      - name: Upload GraalPy wheel
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graalpy-wheel
          path: wheelhouse/*.whl
          if-no-files-found: warn
          compression-level: 0
