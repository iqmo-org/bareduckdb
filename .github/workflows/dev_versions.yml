name: Extensive Tests

# This tests is a more extensive suite that's likely more fragile and slower:
# - parallel thread safety tests
# - Nightly builds of pyarrow and pandas
# - Downstream integration tests for common libraries
# - Ensures pyarrow capsules (via polars) works without importing pyarrow
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev_versions:
    name: 'Full Tests - Python ${{ matrix.python-version }} - ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.15t'
          # - os: macos-latest
          #   python-version: '3.12'
          - os: macos-latest
            python-version: '3.14t'
          - os: windows-latest
            python-version: '3.15'
          - os: windows-latest
            python-version: '3.15t'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize DuckDB submodule (headers only)
        shell: bash
        run: |
          # Initialize the duckdb submodule with sparse checkout (headers only)
          git submodule update --init external/duckdb
          cd external/duckdb
          git sparse-checkout init --cone
          git sparse-checkout set src/include
          cd ../..

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: -dev-versions-${{ matrix.python-version }}

      - name: Setup Compiler
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: MSVC ships with the runner and matches DuckDB's prebuilt DLL
            echo "Using MSVC"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS: Use AppleClang (default) to match DuckDB's build
            # DuckDB prebuilt binaries are compiled with AppleClang
            echo "Using default AppleClang compiler"
            cc --version
            c++ --version
          else
            # Ubuntu: Install and configure GCC 14
            sudo apt-get update
            sudo apt-get install -y gcc-14 g++-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
            echo "CC=gcc-14" >> $GITHUB_ENV
            echo "CXX=g++-14" >> $GITHUB_ENV
            gcc --version
            g++ --version
          fi

      - name: Refresh lock for nightly deps
        run: uv lock --upgrade

      - name: Build
        shell: bash
        run: |
          # No --no-build: pyyaml ships no cp315 wheel and must build from its sdist
          uv sync --no-install-project
          uv sync --reinstall-package bareduckdb -v

      - name: Install polars
        shell: bash
        # TODO: 3.14t: no polars support yet for free threading
        # TODO: 3.15: pola-rs/polars#28347
        if: matrix.python-version != '3.14t' && !startsWith(matrix.python-version, '3.15')
        run: |
          uv pip install --only-binary :all: polars

      - name: Run core tests 1
        shell: bash
        run: |
          uv run --no-sync pytest tests --ignore=tests/experimental --ignore=tests/downstream --ignore=tests/comparison --ignore=tests/benchmarks -v -n auto

      - name: Run parallel thread safety tests
        shell: bash
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          THREADS=$((NPROC - 1))
          THREADS=$((THREADS < 1 ? 1 : THREADS))  # Ensure at least 1 thread
          echo "NPROC: $NPROC"
          echo "THREADS: $THREADS"
          uv run --no-sync pytest tests/ -n 0 --parallel-threads=$THREADS --iterations=10 --tb=short -v -m "not asyncio" --ignore=tests/experimental --ignore=tests/comparison --ignore=tests/downstream --ignore=tests/benchmarks --cov=bareduckdb --cov-append

      - name: Test PyArrow is Optional
        # TODO: 3.15: pola-rs/polars#28347
        if: matrix.python-version != '3.14t' && !startsWith(matrix.python-version, '3.15')
        shell: bash
        run: |
          # Test that bareduckdb works with polars without pyarrow installed
          uv pip uninstall pyarrow
          uv run --no-sync pytest tests/polars_only tests/polars_pushdown -v --cov=bareduckdb --cov-append
          uv pip install pyarrow

      - name: Run DuckDB comparison tests
        # duckdb has no 3.14t or 3.15 wheels yet.
        if: matrix.python-version != '3.14t' && !startsWith(matrix.python-version, '3.15')
        shell: bash
        run: |
          uv pip install "duckdb==1.5.*" --pre
          uv run --no-sync pytest tests/comparison -v --tb=short --cov=bareduckdb --cov-append
          uv pip uninstall duckdb

      # - name: Test PyPI DuckDB extensions
      #   if: matrix.python-version != '3.14t'
      #   shell: bash
      #   run: |
      #     uv pip install duckdb-extensions==1.4.2 duckdb-extension-httpfs

      #     uv run --no-sync python -c "
      #     import bareduckdb
      #     conn = bareduckdb.Connection()

      #     conn.load_extension('httpfs')

      #     result = conn.execute('''SELECT * FROM duckdb_extensions() WHERE extension_name = 'httpfs' ''').fetchall()
      #     assert len(result) > 0, 'httpfs extension not loaded'

      #     extension_info = result[0]
      #     assert extension_info[1] is False
      #     assert extension_info[2] is True

      #     conn.close()
      #     "

      #     uv pip uninstall duckdb-extensions duckdb-extension-httpfs

      - name: Run downstream integration tests
        # TODO: No duckdb 3.15
        if: matrix.python-version != '3.14t' && !startsWith(matrix.python-version, '3.15')
        shell: bash
        run: |
          # magic-duckdb
          uv sync --group downstream

          # Run tests separately to avoid module contamination
          uv run --no-sync pytest tests/downstream/test_sqlalchemy.py tests/downstream/test_magic_duckdb.py -v --cov=bareduckdb --cov-append
          uv run --no-sync pytest tests/downstream/test_jupysql.py -v --cov=bareduckdb --cov-append

      - name: Install dependencies nightly builds
        shell: bash
        run: |
          # Install nightly builds of pyarrow and pandas
          # These replace the stable versions installed by uv sync
          uv pip install --pre --upgrade --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --no-build pandas pyarrow
          # uv pip install git+https://github.com/apache/arrow-adbc#subdirectory=python/adbc_driver_manager

      - name: Rebuild with nightly PyArrow
        shell: bash
        run: |
          rm -rf build/ && find src/bareduckdb \( -name "*.so" -o -name "*.pyd" \) -delete  # Clean old build artifacts
          uv sync --reinstall-package bareduckdb -v
      
      - name: Run core tests against Nightlys
        shell: bash
        run: |
          uv run --no-sync pytest tests --ignore=tests/experimental --ignore=tests/downstream --ignore=tests/comparison --ignore=tests/benchmarks -v --cov=bareduckdb --cov-append -n auto

      - name: Generate coverage report
        if: always()
        shell: bash
        run: |
          uv run --no-sync coverage report --show-missing

      - name: Count Lines of Code (cloc)
        uses: djdefi/cloc-action@main
        if: matrix.os == 'ubuntu-latest'
        with:
          options: --exclude-dir=tests,external,.git,.github,benchmarks,notebooks

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dev-versions-test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7

  musl:
    name: 'Musl Tests - ${{ matrix.python }} - musllinux_1_2'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: cp312, pydir: cp312-cp312 }
          - { python: cp315t, pydir: cp315-cp315t }

    steps:
      # Checkout on the glibc host
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize DuckDB submodule (headers only)
        shell: bash
        run: |
          git submodule update --init external/duckdb
          cd external/duckdb
          git sparse-checkout init --cone
          git sparse-checkout set src/include
          cd ../..

      - name: Build and test in musllinux_1_2
        shell: bash
        # Same image cibuildwheel uses
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            quay.io/pypa/musllinux_1_2_x86_64 sh -c '
              set -e
              PY=/opt/python/${{ matrix.pydir }}/bin/python
              test -x "$PY" || { echo "ERROR: no interpreter at $PY"; ls /opt/python; exit 1; }
              gcc --version | head -1
              export UV_PYTHON="$PY"
              uv sync --no-default-groups --extra test --reinstall-package bareduckdb -v

              # libduckdb must be the musl build, not glibc
              LIB=$(find src/bareduckdb/_libs -name "libduckdb.so")
              readelf -d "$LIB" | grep -q "libc.musl" || { echo "ERROR: $LIB is not musl-linked"; exit 1; }
              echo "OK: $LIB is musl-linked"

              # musl only matches a DT_NEEDED against libraries its own loader opened by
              # name, so the ctypes preload in bareduckdb/__init__.py cannot satisfy the
              # extension modules "libduckdb.so" the way glibc does. Install the library
              # into the installed package instead, where their RUNPATH ($ORIGIN/../../_libs)
              # looks for it.
              PKG=$(uv run --no-sync python -c \
                  "import importlib.util as u; print(u.find_spec(\"bareduckdb\").submodule_search_locations[0])")
              if [ "$(realpath -m "$PKG/_libs")" != "$(realpath -m "$(dirname "$LIB")")" ]; then
                mkdir -p "$PKG/_libs"
                cp -f "$LIB" "$PKG/_libs/"
                echo "Installed $LIB into $PKG/_libs"
              else
                echo "Package already resolves to $(dirname "$LIB")"
              fi

              uv run --no-sync pytest tests --ignore=tests/experimental --ignore=tests/downstream \
                  --ignore=tests/comparison --ignore=tests/benchmarks \
                  -o addopts="" -q -n auto
            '
